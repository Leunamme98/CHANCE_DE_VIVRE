@switch (code()) {
  @case ('fr') {
    <svg viewBox="0 0 60 40" role="img" aria-hidden="true">
      <rect width="60" height="40" fill="#FFFFFF" />
      <rect width="20" height="40" fill="#002395" />
      <rect x="40" width="20" height="40" fill="#ED2939" />
    </svg>
  }
  @case ('en') {
    <!--
      Union Jack dessiné sur un cadre 3:2 (et non son 2:1 officiel) pour que les trois drapeaux
      aient exactement la même taille dans la liste. Les diagonales rouges sont symétriques
      plutôt que contrariées comme sur le vrai drapeau : à 24 px de large la nuance est
      invisible, et ça évite un `clipPath` avec un identifiant qui pourrait entrer en conflit.
    -->
    <svg viewBox="0 0 60 40" role="img" aria-hidden="true">
      <rect width="60" height="40" fill="#012169" />
      <path d="M0,0 L60,40 M60,0 L0,40" stroke="#FFFFFF" stroke-width="8" />
      <path d="M0,0 L60,40 M60,0 L0,40" stroke="#C8102E" stroke-width="3.5" />
      <path d="M30,0 V40 M0,20 H60" stroke="#FFFFFF" stroke-width="13" />
      <path d="M30,0 V40 M0,20 H60" stroke="#C8102E" stroke-width="8" />
    </svg>
  }
  @case ('de') {
    <svg viewBox="0 0 60 40" role="img" aria-hidden="true">
      <rect width="60" height="13.34" fill="#000000" />
      <rect y="13.34" width="60" height="13.33" fill="#DD0000" />
      <rect y="26.67" width="60" height="13.33" fill="#FFCE00" />
    </svg>
  }
}
