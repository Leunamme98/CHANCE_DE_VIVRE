<header class="cdv-header">
  <div class="cdv-header__bar">
    <a class="cdv-header__logo" routerLink="/" (click)="fermerMenu()">
      <span class="cdv-header__logo-corps">
        <span class="cdv-header__logo-eyebrow">{{ 'NAV.LOGO_EYEBROW' | translate }}</span>
        <span class="cdv-header__logo-nom">{{ 'NAV.LOGO_NOM' | translate }}</span>
      </span>
      <span class="cdv-header__drapeaux" aria-hidden="true">
        <svg viewBox="0 0 300 200" class="cdv-header__drapeau-tissu cdv-header__drapeau-tissu--togo">
          <rect width="300" height="200" fill="#006A4E" />
          <rect y="40" width="300" height="40" fill="#FFCE00" />
          <rect y="120" width="300" height="40" fill="#FFCE00" />
          <rect width="120" height="120" fill="#D21034" />
          <polygon
            fill="#FFFFFF"
            points="60,45 68,68 92,68 72,82 80,105 60,91 40,105 48,82 28,68 52,68"
          />
        </svg>
        <svg
          viewBox="0 0 300 200"
          class="cdv-header__drapeau-tissu cdv-header__drapeau-tissu--allemagne"
        >
          <rect width="300" height="66.6" y="0" fill="#000000" />
          <rect width="300" height="66.6" y="66.6" fill="#DD0000" />
          <rect width="300" height="66.8" y="133.2" fill="#FFCE00" />
        </svg>
      </span>
    </a>

    <nav class="cdv-header__nav" [class.cdv-header__nav--ouvert]="menuOuvert()">
      <div class="cdv-header__liens">
        <a
          #navLien
          routerLink="/"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="fermerMenu()"
          >{{ 'NAV.ACCUEIL' | translate }}</a
        >
        <a #navLien routerLink="/a-propos" routerLinkActive="active" (click)="fermerMenu()">{{
          'NAV.A_PROPOS' | translate
        }}</a>
        <a #navLien routerLink="/projets" routerLinkActive="active" (click)="fermerMenu()">{{
          'NAV.PROJETS' | translate
        }}</a>
        <span
          class="cdv-header__indicateur"
          [style.transform]="'translateX(' + indicateur().left + 'px)'"
          [style.width.px]="indicateur().width"
        ></span>
      </div>

      <a
        routerLink="/contact"
        routerLinkActive="cdv-header__contact--actif"
        class="cdv-header__contact"
        [attr.aria-label]="'COMMON.NOUS_CONTACTER' | translate"
        [attr.data-tooltip]="'NAV.CONTACT_TOOLTIP' | translate"
        (click)="fermerMenu()"
      >
        <span class="cdv-header__contact-texte">{{ 'NAV.CONTACT' | translate }}</span>
        <span class="cdv-header__contact-anneau" aria-hidden="true">
          <span class="cdv-header__contact-icone">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C11.8 21 3 12.2 3 3.9 3 3.4 3.4 3 4 3h3.4c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1.1z"
              />
            </svg>
          </span>
        </span>
      </a>

    </nav>

    <div class="cdv-header__actions">
      <!--
        Selecteur de langue place DANS la barre et non dans le menu hamburger : un visiteur qui
        ne lit pas la langue courante ne penserait pas a ouvrir un menu pour en changer.
      -->
      <div class="cdv-header__langue-select" #selecteurLangue>
        <button
          type="button"
          class="cdv-header__langue-declencheur"
          [class.cdv-header__langue-declencheur--ouvert]="languesOuvertes()"
          (click)="basculerLangues()"
          [attr.aria-expanded]="languesOuvertes()"
          aria-haspopup="listbox"
          [attr.aria-label]="'COMMON.CHANGER_LANGUE' | translate"
        >
          <svg class="cdv-header__globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10" />
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
            <path d="M2 12h20" />
          </svg>
          <span class="cdv-header__langue-code">{{ abregeCourant() }}</span>
          <svg class="cdv-header__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="6 9 12 15 18 9" />
          </svg>
        </button>

        @if (languesOuvertes()) {
          <ul class="cdv-header__langue-panneau" role="listbox" [attr.aria-label]="'COMMON.CHANGER_LANGUE' | translate">
            @for (langue of langues; track langue.code) {
              <li>
                <button
                  type="button"
                  role="option"
                  class="cdv-header__langue-option"
                  [class.cdv-header__langue-option--active]="langueActuelle() === langue.code"
                  [attr.aria-selected]="langueActuelle() === langue.code"
                  [attr.lang]="langue.code"
                  (click)="changerLangue(langue.code)"
                >
                  <cdv-drapeau-langue [code]="langue.code" />
                  <span class="cdv-header__langue-nom">{{ langue.nom }}</span>
                  @if (langueActuelle() === langue.code) {
                    <svg class="cdv-header__coche" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <polyline points="20 6 9 17 4 12" />
                    </svg>
                  }
                </button>
              </li>
            }
          </ul>
        }
      </div>

      <button
        type="button"
        class="cdv-header__burger"
        [class.cdv-header__burger--ouvert]="menuOuvert()"
        (click)="basculerMenu()"
        [attr.aria-expanded]="menuOuvert()"
        [attr.aria-label]="(menuOuvert() ? 'NAV.FERMER_MENU' : 'NAV.OUVRIR_MENU') | translate"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>
