# Déploiement Netlify — site statique pré-rendu (Angular + @angular/ssr en mode Prerender).
#
# Volontairement SANS clé `base`. Avec un `base`, la résolution du chemin `publish` est ambiguë :
# la documentation dit qu'il est relatif au `base`, mais Netlify a modifié ce comportement par le
# passé pour les dépôts à sous-dossiers, et un chemin mal résolu produit un déploiement vide qui
# répond 404 partout sans message d'erreur explicite.
# Sans `base`, `publish` est sans ambiguïté relatif à la racine du dépôt, et la commande gère
# elle-même le passage dans `frontend/`.

[build]
  command = "cd frontend && npm ci && npm run build"
  publish = "frontend/dist/chance-de-vivre/browser"

[build.environment]
  # Angular 22 exige Node ^20.19 || ^22.12 || ^24. On épingle 24 : « 22 » pourrait résoudre vers
  # un 22.x antérieur à 22.12, que la CLI Angular refuserait.
  NODE_VERSION = "24"

# Aucune redirection SPA (`/* -> /index.html`) n'est déclarée volontairement : `ng build` génère
# un vrai fichier HTML pour chacune des 4 routes (cf. app.routes.server.ts), que Netlify sert
# directement. Un catch-all renverrait un HTTP 200 sur les URL inexistantes, ce qui produirait
# des « soft 404 » pénalisés par les moteurs de recherche.

# Le service worker et son manifeste ne doivent jamais être servis depuis un cache :
# sinon un visiteur déjà venu peut rester bloqué indéfiniment sur une version périmée du site.
[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache"

# Désactiver les injections Netlify non essentielles
[context.production]
  environment = { NETLIFY_SKIP_ROBOTS_TXT = "true" }
